apiVersion: v1
kind: ConfigMap
metadata:
  name: streamspace-default-apps
  namespace: streamspace
  labels:
    app.kubernetes.io/name: streamspace
    app.kubernetes.io/component: config
data:
  # List of applications to install automatically on controller startup.
  # The controller will check if these exist and create them if missing.
  #
  # NOTE: Templates are sourced from the streamspace-templates sibling repo
  # and the streamspace-dev/streamspace image-pipeline custom builds.
  # The default install seeds a single working template (chrome-selkies) so
  # the bootstrap experience exercises the Selkies streaming path end-to-end.
  applications: |
    - templateName: chrome-selkies
      catalogTemplateID: 1
      displayName: Google Chrome
      description: Chrome browser streamed via Selkies-GStreamer (WebRTC)
      category: Web Browsers
      manifest: |
        apiVersion: stream.space/v1alpha1
        kind: Template
        spec:
          displayName: Google Chrome
          description: Chrome browser streamed via Selkies-GStreamer (WebRTC)
          category: Web Browsers
          icon: https://raw.githubusercontent.com/streamspace-dev/streamspace/main/ui/public/icons/chrome.svg
          baseImage: ghcr.io/streamspace-dev/chrome-selkies:latest
          streamingProtocol: selkies
          defaultResources:
            memory: 2Gi
            cpu: "1"
          ports:
            - name: selkies
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
          capabilities:
            - Network
            - Audio
            - Clipboard
          tags:
            - browser
            - web
            - selkies
