version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: streamspace-postgres
    environment:
      POSTGRES_DB: streamspace
      POSTGRES_USER: streamspace
      POSTGRES_PASSWORD: streamspace
    ports:
      - "${STREAMSPACE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamspace"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamspace

  # NATS message broker for event-driven architecture
  nats:
    image: nats:2.10-alpine
    container_name: streamspace-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
      - "6222:6222"   # Cluster routing
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamspace
    restart: unless-stopped

  # StreamSpace API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE}
    container_name: streamspace-api
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: streamspace
      DB_PASSWORD: streamspace
      DB_NAME: streamspace

      # API configuration
      API_PORT: 8000
      GIN_MODE: debug

      # JWT configuration
      JWT_SECRET: streamspace-local-dev-secret-change-me-32chars

      # Agent bootstrap for local development
      AGENT_BOOTSTRAP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AGENT_BOOTSTRAP_AUTO_APPROVE: "true"

      # NATS configuration
      NATS_URL: nats://nats:4222
      NATS_USER: ""
      NATS_PASSWORD: ""
      PLATFORM: docker

      # Sync configuration
      SYNC_INTERVAL: 1h

      # Kubernetes config (when running outside cluster)
      # KUBECONFIG: /root/.kube/config
    ports:
      - "8000:8000"
    volumes:
      # Mount kubeconfig for local development (optional)
      # - ~/.kube:/root/.kube:ro
      - /tmp/streamspace-repos:/tmp/streamspace-repos
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - streamspace
    restart: unless-stopped

  docker-agent:
    build:
      context: ./agents/docker-agent
      dockerfile: Dockerfile
    container_name: streamspace-docker-agent
    user: "0:0"
    depends_on:
      api:
        condition: service_started
    environment:
      AGENT_ID: docker-dev-local
      CONTROL_PLANE_URL: ws://api:8000
      AGENT_API_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PLATFORM: docker
      REGION: local
      DOCKER_HOST: unix:///var/run/docker.sock
      NETWORK_NAME: streamspace
      VOLUME_DRIVER: local
      MAX_CPU: 8
      MAX_MEMORY: 32
      MAX_SESSIONS: 25
      HEALTH_CHECK_INTERVAL: 30
      ENABLE_HA: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "pgrep", "docker-agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - streamspace
    restart: unless-stopped

  # StreamSpace Docker Controller (for Docker platform support)
  docker-controller:
    build:
      context: ./docker-controller
      dockerfile: Dockerfile
    container_name: streamspace-docker-controller
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ""
      NATS_PASSWORD: ""
      CONTROLLER_ID: streamspace-docker-controller-1
      DOCKER_NETWORK: streamspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - streamspace
    profiles:
      - docker
    restart: unless-stopped

  # pgAdmin for database management (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streamspace-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@streamspace.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - streamspace
    profiles:
      - dev
    restart: unless-stopped

  # Prometheus for metrics (optional, for development)
  prometheus:
    image: prom/prometheus:latest
    container_name: streamspace-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - streamspace
    profiles:
      - monitoring
    restart: unless-stopped

  # Grafana for dashboards (optional, for development)
  grafana:
    image: grafana/grafana:latest
    container_name: streamspace-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - streamspace
    profiles:
      - monitoring
    restart: unless-stopped

networks:
  streamspace:
    name: streamspace
    driver: bridge

volumes:
  postgres-data:
    name: streamspace-postgres-data
  nats-data:
    name: streamspace-nats-data
  pgadmin-data:
    name: streamspace-pgadmin-data
  prometheus-data:
    name: streamspace-prometheus-data
  grafana-data:
    name: streamspace-grafana-data
